<script>(function (root) {
  'use strict';
  const day = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const parse = value => new Date(value + 'T12:00:00');
  const shift = (value, amount) => { const d = parse(value); d.setDate(d.getDate()+amount); return day(d); };
  const days = (end = day(), count = 7) => Array.from({length:count}, (_,i) => shift(end, i-count+1));
  const uuid = () => globalThis.crypto?.randomUUID?.() || `m${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
  const empty = () => ({schemaVersion:1, profile:{name:''}, habits:[], goals:[], projects:[], activities:[]});
  const percent = (done,total) => total ? Math.round(done/total*100) : null;
  const scheduled = (h,d) => d>=h.created && (!h.archivedOn || d<h.archivedOn) && h.weekdays.includes(parse(d).getDay());
  const habitStats = (habits, end=day(), count=7) => {
    let done=0,total=0;
    for(const d of days(end,count)) for(const h of habits) if(scheduled(h,d)) {total++; if(h.checks[d]) done++;}
    return {done,total,rate:percent(done,total)};
  };
  const streak = (h,end=day()) => {
    let n=0;
    for(let d=end; d>=h.created; d=shift(d,-1)) {
      if(!scheduled(h,d)) continue;
      if(h.checks[d]) n++; else if(d!==end) break;
    }
    return n;
  };
  const projectStats = p => { const total=p.tasks.length, done=p.tasks.filter(t=>t.status==='done').length; return {total,done,rate:percent(done,total)}; };
  const goalPercent = g => Math.min(100, Math.max(0, Math.round(g.current/g.target*100)));
  const projectProgressDays = (projects,end=day(),count=7) => {
    const allowed = new Set(days(end,count)), result=new Set();
    projects.forEach(p=>p.tasks.forEach(t=>{if(t.status==='done' && allowed.has(t.completedOn)) result.add(t.completedOn);}));
    return result.size;
  };
  const progressDays = (state,end=day(),count=7) => {
    const span=days(end,count),result=new Set();
    for(const d of span) {
      if(state.habits.some(h=>scheduled(h,d)&&h.checks[d])) result.add(d);
      if(state.projects.some(p=>p.tasks.some(t=>t.status==='done'&&t.completedOn===d))) result.add(d);
      if(state.goals.some(g=>g.updates.some(u=>u.day===d&&u.delta>0))) result.add(d);
    }
    return result.size;
  };
  const validDate = d => typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(parse(d)) && day(parse(d))===d;
  function validate(s) {
    const fail = () => {throw new Error('This file is not a valid Momentum backup. Your existing data has not been changed.');};
    const str=x=>typeof x==='string', arr=Array.isArray;
    const id=x=>x && str(x.id) && /^[a-zA-Z0-9_-]+$/.test(x.id);
    const named=x=>id(x)&&str(x.name)&&x.name.trim().length>0&&validDate(x.created)&&str(x.description);
    const note=n=>id(n)&&str(n.text)&&validDate(n.day)&&str(n.at);
    const archive=x=>x.archivedOn===null || validDate(x.archivedOn);
    if(!s || s.schemaVersion!==1 || !s.profile || !str(s.profile.name) || !arr(s.habits)||!arr(s.goals)||!arr(s.projects)||!arr(s.activities)) fail();

total?'Every step is complete. Add your closing thoughts, then archive this project when you’re ready.':'Choose one small action and mark it “Start working.” Keep the next step specific.'}</div>${p.due?`<small>Project deadline: ${pretty(p.due,{month:'long',day:'numeric',year:'numeric'})}</small>`:''}`)}</div></div>`;}
function activityView(){return pageHead('Your progress has a history.','A running record of your habits, goals, project steps, and updates.')+panel('Activity log',`${state.activities.length} recorded changes`,state.activities.length?state.activities.map(a=>`<div class="activity-item"><div class="activity-dot"></div><div><p>${esc(a.text)}</p><small>${pretty(a.day,{month:'long',day:'numeric',year:'numeric'})} · ${new Date(a.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</small></div></div>`).join(''):empty('Your next step is the beginning','As you make changes, your story will appear here.','','','activity'));}
function settingsView(){return pageHead('Make this space yours.','A few preferences, and a safe place for your progress.')+`<div class="settings-grid">${panel('Your workspace','A personal touch',`<form id="profile-form"><label class="field">Your first name<input name="name" value="${esc(state.profile.name)}" placeholder="Your name" maxlength="60"></label>${btn('Save name','submit-profile','primary')}</form>`)}${panel('Your data','Keep a copy of your progress',`<p>${native?'Your data is stored on this Mac in Application Support/Momentum.':'This preview stores data in this browser. Use the Mac installer for a dedicated desktop app.'} Nothing is sent to a server.</p><div class="actions">${btn(icon('download')+' Export backup','export')}${btn(icon('upload')+' Import backup','import')}</div><div class="info-box">Import replaces your current workspace after confirmation. Export a backup first. ${native?'The desktop app also keeps daily snapshots for up to 30 days.':'Browser data and Mac app data are separate. Export here and import into the Mac app to transfer your work.'}</div>${native?btn(icon('project')+' Show data folder','show-data','small'):''}`)}${panel('How the numbers work','Clear metrics, no guesswork',`<p><strong>Habit consistency:</strong> completed check-ins ÷ scheduled habit days in the displayed period. Days before creation, rest days, and dates on or after archiving are excluded. Today is included and still in progress.</p><p><strong>Streaks:</strong> consecutive completed scheduled days. Rest days don’t break a streak, and an unfinished today does not break it until tomorrow.</p><p><strong>Project completion:</strong> completed steps ÷ all steps in unarchived projects. Reopening or deleting a step updates the percentage. Deleting changes the denominator.</p><p><strong>Progress days:</strong> days with a habit check-in, a currently completed step, or a positive goal update. Project progress days count completed steps only. Notes are recorded in activity but do not inflate completion.</p><p><strong>Goals:</strong> current amount ÷ target, capped at 100%. Accomplished means current amount is at least the target. A dash means there’s no eligible data.</p>`)}${panel('Take a look around','Try a temporary example workspace',`<p>Explore a populated workspace with sample habits, goals, and projects. Demo changes are temporary. Your own workspace is kept separately and restored when you leave the demo.</p>${btn('Explore demo workspace','demo')}<div class="info-box">Momentum 1.0 · Offline desktop edition<br>No account, subscription, or internet connection required to use the app.</div>`)}</div>`;}
function searchView(){const q=query.toLowerCase(),items=[...state.habits.filter(h=>`${h.name} ${h.description} ${h.notes.map(n=>n.text).join(' ')}`.toLowerCase().includes(q)).map(h=>({name:h.name,type:'Habit',action:'habit-history',id:h.id})),...state.goals.filter(g=>`${g.name} ${g.description} ${g.updates.map(n=>n.text).join(' ')}`.toLowerCase().includes(q)).map(g=>({name:g.name,type:'Personal goal',action:'goal-history',id:g.id})),...state.projects.filter(p=>`${p.name} ${p.description} ${p.tasks.map(t=>t.title+' '+t.notes).join(' ')} ${p.notes.map(n=>n.text).join(' ')}`.toLowerCase().includes(q)).map(p=>({name:p.name,type:'Project',action:'open-project',id:p.id}))];return pageHead('Find your focus.',`${items.length} results for “${esc(query)}”`)+`<div class="search-results">${items.length?items.map(i=>`<button class="result" data-action="${i.action}" data-id="${i.id}"><strong>${esc(i.name)}</strong><small>${i.type}</small></button>`).join(''):empty('No matches yet','Try a different word or phrase.','','','search')}</div>`;}

function openModal(title,body,submitLabel,handler){
 modal.innerHTML=`<div class="modal-head"><h2 id="modal-title">${esc(title)}</h2>${ib('close','close-modal','Close dialog')}</div>${handler?'<form id="modal-form">':''}<div id="modal-error" class="modal-error" role="alert"></div>${body}${submitLabel?`<div class="modal-actions">${btn('Cancel','close-modal','','type="button"')}<button class="btn primary" type="submit">${submitLabel}</button></div>`:''}${handler?'</form>':''}`;
 if(!modal.open)modal.showModal();
 if(handler)$('#modal-form').onsubmit=e=>{e.preventDefault();try{handler(new FormData(e.target));}catch(err){$('#modal-error').textContent=err.message;}};
 setTimeout(()=>modal.querySelector('input:not([type=checkbox]),textarea,button')?.focus(),30);
}
function closeModal(){modal.close();}
function field(label,name,value='',options={}){return `<label class="field">${label}<input name="${name}" value="${esc(value)}" type="${options.type||'text'}" ${options.required?'required':''} ${options.extra||''}></label>`;}
function textField(label,name,value='',placeholder=''){return `<label class="field">${label}<textarea name="${name}" placeholder="${esc(placeholder)}" maxlength="20000">${esc(value)}</textarea></label>`;}
function namedValue(f,key='name'){const v=String(f.get(key)||'').trim();if(!v)throw new Error('Please enter a name.');return v;}
function confirmDialog(title,text,onConfirm,label='Confirm'){openModal(title,`<p class="muted" style="font-size:13px">${esc(text)}</p>`,label,()=>{onConfirm();closeModal();});}
function collection(kind){return state[{habit:'habits',goal:'goals',project:'projects'}[kind]];}
function entity(kind,id){return collection(kind).find(i=>i.id===id);}
function editEntity(kind,id){
 const item=id?entity(kind,id):null,entityLabel={habit:'habit',goal:'goal',project:'project'}[kind];
 const archiveControls=item?`<div class="actions">${btn(icon('archive')+(item.archivedOn?' Restore':' Archive'),'archive-item','small',`type="button" data-kind="${kind}" data-id="${id}"`)}${btn(icon('trash')+' Delete','delete-item','small danger',`type="button" data-kind="${kind}" data-id="${id}"`)}</div>`:'';
 let specific='';
 if(kind==='habit'){
 const chosen=item?.weekdays||[0,1,2,3,4,5,6];
 specific=`<label class="field">Repeat on</label><div class="weekday-picker">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,i)=>`<label><input type="checkbox" name="weekday" value="${i}" ${chosen.includes(i)?'checked':''} ${item?'disabled':''}>${n}</label>`).join('')}</div>${item?'<div class="notice" style="margin-bottom:18px">To change repeat days, archive this habit and create a new one. This preserves the meaning of past check-ins and percentages.</div>':field('Start tracking from','created',C.day(),{type:'date',required:true,extra:`max="${C.day()}"`})}`;
 }
 if(kind==='goal')specific=`<div class="form-row">${field('Target amount','target',item?.target||'',{type:'number',required:true,extra:'min="0.01" step="any"'})}${field('Unit','unit',item?.unit||'',{extra:'placeholder="e.g. dollars, workouts" maxlength="40"'})}</div>${!item?field('Starting amount','current',0,{type:'number',required:true,extra:'min="0" step="any"'}):'<div class="notice" style="margin-bottom:16px">Use Update progress to change your current amount and keep a dated record.</div>'}${field('Target date (optional)','due',item?.due||'',{type:'date'})}`;
 if(kind==='project')specific=field('Project deadline (optional)','due',item?.due||'',{type:'date'});
 openModal(`${item?'Edit':'New'} ${entityLabel}`,field(kind==='project'?'Project name':kind==='goal'?'What’s your goal?':'Habit name','name',item?.name||'',{required:true,extra:'maxlength="160"'})+textField(kind==='habit'?'Why this matters (optional)':'Description (optional)','description',item?.description||'')+specific+archiveControls,item?'Save changes':`Create ${entityLabel}`,f=>{
 const name=namedValue(f),description=String(f.get('description')||'').trim();
 let data={name,description};
 if(kind==='habit'&&!item){const weekdays=f.getAll('weekday').map(Number),created=String(f.get('created'));if(!weekdays.length)throw new Error('Choose at least one repeat day.');if(!C.validDate(created)||created>C.day())throw new Error('Choose today or an earlier start date.');data={...data,weekdays,created,checks:{},notes:[]};}
 if(kind==='goal'){const target=Number(f.get('target')),current=item?item.current:Number(f.get('current'));if(!Number.isFinite(target)||target<=0||!Number.isFinite(current)||current<0)throw new Error('Use a positive target and a starting amount of zero or more.');data={...data,target,current,unit:String(f.get('unit')||'').trim(),due:String(f.get('due')||''),...(!item?{updates:[]}: {})};}
 if(kind==='project')data={...data,due:String(f.get('due')||''),...(!item?{tasks:[],notes:[]}: {})};
 if(item)Object.assign(item,data);else{const newItem={id:C.uuid(),created:C.day(),archivedOn:null,...data};collection(kind).push(newItem);if(kind==='project'){view='projects';selectedProject=newItem.id;}else view=kind==='habit'?'habits':'goals';showArchived=false;query='';}
 addActivity(`${item?'Updated':'Created'} ${entityLabel}: ${name}`);closeModal();save();toast(item?'Changes saved':`${entityLabel[0].toUpperCase()+entityLabel.slice(1)} created`);
 });
}
function editTask(projectID,id){const p=entity('project',projectID||selectedProject);if(!p||p.archivedOn){toast('Restore this project before editing its steps.');return;}const t=id?p.tasks.find(t=>t.id===id):null;
 openModal(t?'Edit project step':'A new next step',field('What needs to happen?','title',t?.title||'',{required:true,extra:'maxlength="250"'})+textField('Details (optional)','notes',t?.notes||'')+`<div class="form-row"><label class="field">Status<select name="status">${[['todo','To do'],['doing','In progress'],['done','Complete']].map(([v,l])=>`<option value="${v}" ${t?.status===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">Priority<select name="priority">${[['normal','Normal'],['high','High'],['low','Low']].map(([v,l])=>`<option value="${v}" ${t?.priority===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`+field('Due date (optional)','due',t?.due||'',{type:'date'})+(t?btn(icon('trash')+' Delete step','delete-task','small danger',`type="button" data-id="${t.id}" data-project="${p.id}"`):''),t?'Save step':'Add step',f=>{
 const status=String(f.get('status'));const data={title:namedValue(f,'title'),notes:String(f.get('notes')||'').trim(),status,priority:String(f.get('priority')),due:String(f.get('due')||''),completedOn:status==='done'?(t?.completedOn||C.day()):null};
 if(t)Object.assign(t,data);else p.tasks.push({id:C.uuid(),...data});
 addActivity(`${t?'Updated':'Added'} step in ${p.name}: ${data.title}${status==='done'?' (complete)':''}`);closeModal();save();toast(t?'Step updated':'Next step added');
 });
}
function habitHistory(id){const h=entity('habit',id);if(!h)return;const end=selectedDay,s=C.habitStats([h],end,28);openModal(h.name,`<div class="split"><span class="pill purple">${C.streak(h)} scheduled-day streak</span><small>${rate(s.rate)} over these 28 days</small></div><div class="calendar-grid">${C.days(end,28).map(d=>`<div class="day-cell"><span>${pretty(d,{month:'short',day:'numeric'})}</span><button data-action="check-habit" data-id="${id}" data-date="${d}" data-history="true" class="${h.checks[d]?'done':''}" aria-pressed="${!!h.checks[d]}" aria-label="${esc(h.name)} ${pretty(d)}" ${!C.scheduled(h,d)||d>C.day()?'disabled':''}>${h.checks[d]?icon('check'):C.parse(d).getDate()}</button></div>`).join('')}</div><p class="notice">${s.done} of ${s.total} scheduled days. Click a scheduled day to record or correct a check-in. Change “Week ending” in Habits to view older dates.</p><div class="split" style="margin-top:23px"><h3>Notes & reflections</h3>${ib('plus','new-note','Add habit note',`data-id="${id}" data-kind="habit"`)}</div>${notesHTML(h.notes,'habit',id)}`);}
function goalHistory(id){const g=entity('goal',id);if(!g)return;openModal(g.name,`<div class="goal-number">${num(g.current)} <span>/ ${num(g.target)} ${esc(g.unit)}</span></div>${progress(C.goalPercent(g))}<div class="split" style="margin-top:20px"><h3>Progress & notes</h3>${!g.archivedOn?btn('Update progress','goal-progress','small',`data-id="${id}"`):''}</div>${notesHTML(g.updates,'goal',id)}`);}
function updateGoal(id){const g=entity('goal',id);if(!g||g.archivedOn)return;openModal('Record your progress',`<p class="muted" style="font-size:13px;margin-bottom:18px">${esc(g.name)} · currently ${num(g.current)} of ${num(g.target)} ${esc(g.unit)}</p>`+field(`New total (${esc(g.unit)||'amount'})`,'current',g.current,{type:'number',required:true,extra:'min="0" step="any"'})+textField('Progress note (optional)','note','','What helped? What’s your next step?'),'Save progress',f=>{const current=Number(f.get('current'));if(!Number.isFinite(current)||current<0)throw new Error('Enter a total of zero or more.');const delta=current-g.current,text=String(f.get('note')||'').trim();if(delta===0&&!text)throw new Error('Change the total or add a note.');g.current=current;g.updates.push({id:C.uuid(),day:C.day(),at:new Date().toISOString(),delta,text});addActivity(`Updated goal ${g.name}: ${num(current)} / ${num(g.target)} ${g.unit}`);closeModal();save();toast('Progress recorded');});}
function editNote(kind,id,noteID){const item=entity(kind,id),notes=kind==='goal'?item.updates:item.notes,n=notes.find(n=>n.id===noteID);openModal(n?'Edit note':'Add an update',textField('Note','text',n?.text||'','Capture an update, a lesson, or your next move.')+(!n?field('Date','day',C.day(),{type:'date',required:true,extra:`max="${C.day()}"`}):'')+(n&&kind!=='goal'?btn(icon('trash')+' Delete note','delete-note','small danger',`type="button" data-kind="${kind}" data-id="${id}" data-note="${n.id}"`):''),'Save note',f=>{const text=namedValue(f,'text');if(n)n.text=text;else{const day=String(f.get('day'));if(!C.validDate(day)||day>C.day())throw new Error('Choose today or an earlier date.');notes.push({id:C.uuid(),text,day,at:new Date().toISOString()});}addActivity(`${n?'Edited':'Added'} note for ${item.name}`);closeModal();save();if(kind==='habit')habitHistory(id);else if(kind==='goal')goalHistory(id);toast('Note saved');});}
function downloadBackup(){const data=JSON.stringify(demo?realState:state,null,2);if(native){send('export',{data});return;}const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Momentum-backup-${C.day()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup download started');}

async function action(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind,pid=el.dataset.project;
 if(el.tagName==='BUTTON'&&el.type!=='submit')e.preventDefault();
 switch(a){
 case 'nav':navigate(el.dataset.view);break;
 case 'close-modal':e.preventDefault();closeModal();break;
 case 'quick-add':openModal('What would you like to add?',`<div class="search-results">${[['habit','A habit','A repeatable action on the days you choose.'],['goal','A personal goal','A measurable target to work toward.'],['project','A business project','An idea with its own steps and updates.']].map(([k,t,d])=>`<button class="result" data-action="new-${k}"><strong>${t}</strong><small>${d}</small></button>`).join('')}</div>`);break;
 case 'new-habit':case 'new-goal':case 'new-project':editEntity(a.slice(4));break;
 case 'edit-habit':case 'edit-goal':case 'edit-project':editEntity(a.slice(5),id);break;
 case 'habit-history':habitHistory(id);break;
 case 'goal-history':goalHistory(id);break;
 case 'goal-progress':updateGoal(id);break;
 case 'archive-filter':showArchived=el.dataset.value==='true';render();break;
 case 'check-habit':{const h=entity('habit',id),d=el.dataset.date;if(!h||!C.scheduled(h,d)||d>C.day())return;h.checks[d]=!h.checks[d];addActivity(`${h.checks[d]?'Completed':'Unchecked'} habit ${h.name} for ${pretty(d)}`);save();if(el.dataset.history)habitHistory(id);break;}
 case 'archive-item':{const item=entity(kind,id);if(item.archivedOn){if(kind==='habit'){const newItem={...JSON.parse(JSON.stringify(item)),id:C.uuid(),created:C.day(),archivedOn:null,checks:{},notes:[]};collection(kind).push(newItem);addActivity(`Started a fresh active habit: ${item.name}`);toast('Habit restored as a fresh habit; archived history is kept');}else{item.archivedOn=null;addActivity(`Restored ${kind}: ${item.name}`);}closeModal();showArchived=false;save();}else confirmDialog(`Archive this ${kind}?`,kind==='habit'?'Your history stays in Archived. Today and future dates stop counting toward consistency. Restoring later starts a new habit with the same name.':'Your notes and history are kept. You can restore this item from the Archived tab.',()=>{item.archivedOn=C.day();addActivity(`Archived ${kind}: ${item.name}`);selectedProject=null;save();},'Archive');break;}
 case 'delete-item':{const item=entity(kind,id);confirmDialog(`Delete ${kind}?`,`“${item.name}” and its associated history, notes, and steps will be permanently removed. This also changes calculated metrics. The activity log keeps its prior entries.`,()=>{state[{habit:'habits',goal:'goals',project:'projects'}[kind]]=collection(kind).filter(x=>x.id!==id);addActivity(`Deleted ${kind}: ${item.name}`);selectedProject=null;save();},'Delete permanently');break;}
 case 'open-project':view='projects';selectedProject=id;query='';closeModal();render();window.scrollTo(0,0);break;
 case 'projects-back':selectedProject=null;render();break;
 case 'new-task':editTask(selectedProject);break;
 case 'edit-task':editTask(pid,id);break;
 case 'toggle-task':case 'start-task':{const p=entity('project',pid),t=p?.tasks.find(t=>t.id===id);if(!t||p.archivedOn)return;t.status=a==='start-task'?'doing':t.status==='done'?'todo':'done';t.completedOn=t.status==='done'?C.day():null;addActivity(`${t.status==='done'?'Completed':t.status==='doing'?'Started':'Reopened'} step in ${p.name}: ${t.title}`);save();break;}
 case 'delete-task':{const p=entity('project',pid),t=p.tasks.find(t=>t.id===id);confirmDialog('Delete this step?',`Delete “${t.title}”? This removes it from this project and recalculates completion.`,()=>{p.tasks=p.tasks.filter(t=>t.id!==id);addActivity(`Deleted step from ${p.name}: ${t.title}`);save();},'Delete step');break;}
 case 'new-note':editNote(kind,id);break;
 case 'edit-note':editNote(kind,id,el.dataset.note);break;
 case 'delete-note':{const item=entity(kind,id);confirmDialog('Delete this note?','This note will be permanently removed.',()=>{item.notes=item.notes.filter(n=>n.id!==el.dataset.note);addActivity(`Deleted note from ${item.name}`);save();},'Delete note');break;}
 case 'export':downloadBackup();break;
 case 'import':if(native)send('import');else $('#import-file').click();break;
 case 'retry-save':save();break;
 case 'show-data':if(native)send('showData');break;
 case 'demo':startDemo();break;
 case 'exit-demo':state=realState;realState=null;demo=false;view='overview';query='';selectedProject=null;render();break;
 }
}
document.addEventListener('click',e=>{try{action(e).catch(err=>toast(err.message));}catch(err){toast(err.message);}});
document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();state.profile.name=String(new FormData(e.target).get('name')||'').trim();save();toast('Name saved');}});
document.addEventListener('change',e=>{if(e.target.id==='habit-date'){if(C.validDate(e.target.value)&&e.target.value<=C.day()){selectedDay=e.target.value;render();}}});
let searchTimer;
document.addEventListener('input',e=>{if(e.target.id==='search-input'){clearTimeout(searchTimer);const q=e.target.value;searchTimer=setTimeout(()=>{query=q.trim();render();const input=$('#search-input');input.focus();input.setSelectionRange(input.value.length,input.value.length);},220);}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(file){if(file.size>25*1024*1024)toast('This backup is too large (maximum 25 MB).');else try{window.momentumImport(await file.text());}catch{toast('Could not read that file.');}}e.target.value='';});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search-input')?.focus();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'&&!modal.open){e.preventDefault();editEntity(view==='projects'?'project':view==='goals'?'goal':'habit');}});
window.momentumExport=downloadBackup;
window.momentumNew=()=>editEntity(view==='projects'?'project':view==='goals'?'goal':'habit');
window.momentumReady=(data,error)=>{try{if(error)throw new Error(error);state=data?C.validate(JSON.parse(data)):C.empty();}catch(e){loadError=e.message;}render();};
if(native)send('load');else{try{const data=localStorage.getItem('momentum.v1');state=data?C.validate(JSON.parse(data)):C.empty();}catch(e){loadError='Saved browser data could not be read. Import a valid backup to recover your workspace.';}render();}
let lastDay=C.day();setInterval(()=>{if(lastDay!==C.day()){lastDay=C.day();selectedDay=lastDay;if(!modal.open)render();}},30000);
</script>
</body></html>
